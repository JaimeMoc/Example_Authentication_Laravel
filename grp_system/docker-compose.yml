services:

  # ── Aplicación Laravel (PHP-FPM + Nginx) ──────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: grp_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "GRP System"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-grp_system}
      DB_USERNAME: ${DB_USERNAME:-grp_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: "GRP System"

      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8000/auth/microsoft2/callback}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persistir storage (logs, uploads, framework cache)
      - app_storage:/var/www/html/storage
    networks:
      - grp_network

  # ── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: grp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-grp_system}
      MYSQL_USER: ${DB_USERNAME:-grp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - grp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Mailpit (servidor de email local para desarrollo) ──────────────────────
  mail:
    image: axllent/mailpit:latest
    container_name: grp_mail
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - grp_network

volumes:
  db_data:
  app_storage:

networks:
  grp_network:
    driver: bridge
