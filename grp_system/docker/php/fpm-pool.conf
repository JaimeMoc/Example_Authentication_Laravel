[www]
user  = www-data
group = www-data

; Escuchar en TCP para compatibilidad con Nginx en el mismo contenedor
listen = 127.0.0.1:9000

; Modo de gestión de procesos — dynamic es el más flexible
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500

; Logs de PHP hacia stdout/stderr del contenedor
php_admin_value[error_log]   = /proc/self/fd/2
php_admin_flag[log_errors]   = on
catch_workers_output         = yes

; Limpiar variables de entorno del servidor para seguridad
clear_env = no
